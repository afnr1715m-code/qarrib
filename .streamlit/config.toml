[theme]
# نظام ألوان موحّد مأخوذ من موك-أبات المستخدمة (الرئيسية + الطلبات +
# لوحة الأسرة) — نفس القيم بالضبط بكل صفحات التطبيق
primaryColor = "#7CB342"             # أخضر أساسي (--green-500) — الأزرار والعناصر الأساسية
backgroundColor = "#FBF8F1"          # خلفية كريمية دافئة (--cream)
secondaryBackgroundColor = "#EAF3DE" # أخضر فاتح جداً (--green-100) للحقول والصناديق الجانبية
textColor = "#4E4B3B"                # بني-زيتوني دافئ (--ink)
font = "sans serif"
