[theme]
# نظام ألوان موحّد مأخوذ من موك-أبات المستخدمة (الرئيسية + الطلبات +
# لوحة الأسرة) — نفس القيم بالضبط بكل صفحات التطبيق
primaryColor = "#7A9B5C"             # أخضر أساسي (--green-500) — الأزرار والعناصر الأساسية
backgroundColor = "#F8F4EC"          # خلفية كريمية دافئة (--cream)
secondaryBackgroundColor = "#EDF1E6" # أخضر فاتح جداً (--green-100) للحقول والصناديق الجانبية
textColor = "#33402B"                # بني-زيتوني دافئ (--ink)
font = "sans serif"
